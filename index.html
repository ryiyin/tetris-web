<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris Web</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="hud" role="status">
        <div class="stat">Puntaje <span id="score">0</span></div>
        <div class="stat">Récord <span id="record">—</span></div>
        <div class="stat">Nivel <span id="level">1</span></div>
        <div class="stat">Líneas <span id="lines">0</span></div>
      </div>
      <div id="board">
        <canvas id="game" width="300" height="600" aria-label="Tablero de Tetris"></canvas>
        <div id="overlay" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
      <div id="controls" role="group" aria-label="Controles táctiles">
        <button type="button" tabindex="-1" data-action="left" aria-label="Izquierda"><span aria-hidden="true">◀</span></button>
        <button type="button" tabindex="-1" data-action="softDrop" aria-label="Bajar"><span aria-hidden="true">▼</span></button>
        <button type="button" tabindex="-1" data-action="right" aria-label="Derecha"><span aria-hidden="true">▶</span></button>
        <button type="button" tabindex="-1" data-action="rotate" aria-label="Rotar"><span aria-hidden="true">⟳</span></button>
        <button type="button" tabindex="-1" data-action="pause" aria-label="Pausa"><span aria-hidden="true">Pausa</span></button>
        <button type="button" tabindex="-1" data-action="restart" aria-label="Reiniciar" disabled><span aria-hidden="true">Reiniciar</span></button>
        <button type="button" tabindex="-1" data-action="hardDrop" aria-label="Caída dura"><span aria-hidden="true">⤓ Caída dura</span></button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
