<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris Web</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="hud" role="status">
        <div class="stat">Puntaje <span id="score">0</span></div>
        <div class="stat">Récord <span id="record">—</span></div>
        <div class="stat">Nivel <span id="level">1</span></div>
        <div class="stat">Líneas <span id="lines">0</span></div>
      </div>
      <div id="board">
        <canvas id="game" width="300" height="600" aria-label="Tablero de Tetris"></canvas>
        <div id="overlay" role="status" aria-live="polite" aria-atomic="true"></div>
      </div>
      <div id="controls">
        <button type="button" data-action="left" aria-label="Mover a la izquierda">◀</button>
        <button type="button" data-action="rotate" aria-label="Rotar">↻</button>
        <button type="button" data-action="right" aria-label="Mover a la derecha">▶</button>
        <button type="button" data-action="softDrop" aria-label="Bajar">▼</button>
        <button type="button" data-action="hardDrop" aria-label="Caída dura">Caer</button>
        <button type="button" data-action="pause" aria-label="Pausar o seguir">Pausa</button>
        <button type="button" data-action="restart" aria-label="Reiniciar partida" hidden>Reiniciar</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
